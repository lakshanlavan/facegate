<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#DD2C50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CodeGloFix">
<link rel="apple-touch-icon" href="/static/codeglofix.png">
<link rel="manifest" href="/static/manifest.json">
<title>CodeGloFix — Live Access</title>
<link rel="icon" type="image/png" href="/static/codeglofix.png">
<link rel="stylesheet" href="/static/css/theme.css">
<style>
/* ══════════════════════════════════════════════════════════════════
   index.html — Gate display for members outside the door.

   Purpose of this page:
     Show the camera feed + access result. Nothing else.
     Members need to see their face being scanned and get a clear
     Granted / Denied result. Business stats, member counts, access
     history, and nav links to admin pages are irrelevant and
     potentially a privacy/security concern at the front door.

   Responsive targets:
     ≥1025px  →  desktop / full monitor    (owner's inside screen)
     ≤1024px  →  7" display                (compact, sidebar hidden)
     ≤600px   →  7" @ 800×480 landscape   (minimal, max camera area)
══════════════════════════════════════════════════════════════════ */

/* ── Page shell ──────────────────────────────────────────────────── */
body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── Navbar overrides for gate display ──────────────────────────── */
/* Hide Enrol, Remote Enrol, Admin nav tabs — members at the door
   should not see or be able to tap these links.                    */
.nav-tab-admin-only { display: none !important; }

/* Clearer Live page brand logo */
.navbar .brand-logo {
  height: 56px;
  max-width: 190px;
  object-fit: contain;
}


/* ── Gate status bar (replaces multi-card stats row) ────────────── */
/* A single slim bar showing only what the member needs:
   gate message (from CV) on the left, live clock on the right.    */
.gate-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 16px;
  height: 36px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.gate-msg {
  font-size: 12px;
  font-weight: 600;
  color: var(--t2);
  font-family: var(--mono);
  letter-spacing: 0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.gate-bar-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

/* ── Camera area ─────────────────────────────────────────────────── */
.body {
  display: flex;
  flex: 1;
  padding: 8px 16px 8px;
  min-height: 0;
  overflow: hidden;
}
.cam-wrap {
  flex: 1;
  background: #000;
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
}
.cam-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}


/* Corner brackets */
.bracket {
  position: absolute;
  width: 16px; height: 16px;
  border-color: rgba(221, 44, 80, 0.4);
  border-style: solid;
  pointer-events: none;
}
.bracket.tl { top:8px;    left:8px;   border-width:2px 0 0 2px; border-radius:3px 0 0 0; }
.bracket.tr { top:8px;    right:8px;  border-width:2px 2px 0 0; border-radius:0 3px 0 0; }
.bracket.bl { bottom:8px; left:8px;   border-width:0 0 2px 2px; border-radius:0 0 0 3px; }
.bracket.br { bottom:8px; right:8px;  border-width:0 2px 2px 0; border-radius:0 0 3px 0; }

/* REC badge */
.cam-rec {
  position: absolute;
  top: 8px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 5px;
  background: rgba(12,15,30,0.75);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: 20px;
  padding: 3px 10px;
  pointer-events: none;
}
.rec-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 5px rgba(239,68,68,0.6);
  animation: dg-pulse 1.5s ease-in-out infinite;
}
.cam-rec span { font-size: 10px; color: var(--red); font-weight: 700; letter-spacing: 1.5px; }

/* Legend */
.cam-legend {
  position: absolute;
  bottom: 10px; left: 10px;
  display: flex; gap: 12px;
  pointer-events: none;
}
.legend-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--t3);
  background: rgba(12,15,30,0.7);
  padding: 3px 8px; border-radius: 4px;
}
.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── Detection popup ─────────────────────────────────────────────── */
/* This is THE primary UI element on this page. When a face is
   recognised the popup appears centre-bottom with the member's
   name and Granted / Denied status. Sized for glanceability.      */
#detect-popup {
  display: none;
  position: fixed;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--bg-card);
  border: 1px solid var(--border-2);
  border-radius: var(--r);
  padding: 16px 28px;
  text-align: center;
  min-width: 260px;
  z-index: 100;
  transition: opacity 0.2s, transform 0.2s;
}
.popup-type { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.popup-name { font-size: 28px; font-weight: 700; color: var(--t1); line-height: 1.2; }
.popup-meta { font-size: 12px; color: var(--t3); margin-top: 5px; font-family: var(--mono); }


/* ══════════════════════════════════════════════════════════════════
   RESPONSIVE — ≤1024px  (7" display)
══════════════════════════════════════════════════════════════════ */
@media (max-width: 1024px) {

  .navbar      { height: 64px; padding: 0 14px; gap: 6px; }
  .brand-sub   { display: none; }
  .brand-logo  { height: 52px; max-width: 170px; object-fit: contain; }
  .brand-name  { font-size: 14px; }
  .nav-sep     { display: none; }

  /* Nav tabs already hidden via .nav-tab-admin-only.
     The "Live View" active tab text is also hidden — icon only.   */
  .nav-tab     { padding: 5px 8px; gap: 0; font-size: 0; }
  .nav-tab svg { width: 15px; height: 15px; }

  .clock { font-size: 12px; }

  .gate-bar    { height: 30px; padding: 0 10px; }
  .gate-msg    { font-size: 11px; }

  .body        { padding: 6px 10px 6px; }

  #detect-popup { bottom: 38px; min-width: 240px; padding: 16px 24px; }
  .popup-name   { font-size: 30px; }
}


/* ══════════════════════════════════════════════════════════════════
   RESPONSIVE — ≤600px  (7" @ 800×480 landscape — tightest height)
══════════════════════════════════════════════════════════════════ */
@media (max-width: 600px) {

  .navbar      { height: 56px; padding: 0 8px; }
  .brand-name  { display: none; }
  .brand-logo  { height: 46px; max-width: 150px; object-fit: contain; }
  .nav-tab     { padding: 4px 6px; }
  .nav-tab svg { width: 14px; height: 14px; }
  .live-badge  { padding: 2px 7px; font-size: 9px; }
  .live-dot    { width: 5px; height: 5px; }
  .clock       { font-size: 11px; letter-spacing: 0; }

  /* Gate bar stays — it shows "Move closer" / "Centre face" etc.
     Members actually need this instruction text.                   */
  .gate-bar    { height: 28px; padding: 0 8px; }
  .gate-msg    { font-size: 10px; }

  .body        { padding: 4px 6px 4px; }

  /* Popup — maximum size on smallest screen */
  #detect-popup { bottom: 28px; min-width: 200px; padding: 14px 20px; }
  .popup-name   { font-size: 34px; }
  .popup-type   { font-size: 13px; letter-spacing: 1.5px; }
  .popup-meta   { font-size: 12px; }

  /* Bottom bar hidden — free every pixel for camera             */
  .bottom-bar  { display: none; }
}
</style>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────
     Only the brand + Live View tab + Live badge + clock are shown.
     Enrol, Remote Enrol, Admin are hidden — this is a public-facing
     gate display. Members must not see or tap admin links.
──────────────────────────────────────────────────────────────── -->
<nav class="navbar">
  <a class="brand" href="/">
    <img class="brand-logo" src="/static/codeglofix.png" alt="CodeGloFix" onerror="this.style.display='none'">
    <div>
      <div class="brand-name">CodeGloFix</div>
      <div class="brand-sub">Access Control</div>
    </div>
  </a>
  <div class="nav-sep"></div>

  <!-- Live View tab — shown (this page) -->
  <a href="/" class="nav-tab active" title="Live View">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    Live View
  </a>

  <!-- Admin-only links — hidden on gate display -->
  <a href="/enrol"        class="nav-tab nav-tab-admin-only" title="Enrol">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
    Enrol
  </a>
  <a href="/enrol_remote" class="nav-tab nav-tab-admin-only" title="Remote Enrol">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="17" r="1"/></svg>
    Remote Enrol
  </a>
  <a href="/admin"        class="nav-tab nav-tab-admin-only" title="Admin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Admin
  </a>

  <div class="nav-right">
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</nav>

<!-- ── Health alert ────────────────────────────────────────────────
     Silent watchdog — only appears if camera goes offline.
     Counts down and auto-reloads. Members don't need to do anything.
──────────────────────────────────────────────────────────────── -->
<div id="system-alert" style="display:none">
  <span id="alert-icon">⚠</span>
  <span id="alert-msg"></span>
  <span class="alert-countdown" id="alert-countdown"></span>
</div>

<!-- ── Gate status bar ─────────────────────────────────────────────
     Shows real-time gate instruction from the CV pipeline:
     "Waiting…" / "Move closer" / "Centre your face" / member name.
     This replaces the 4-card stats row entirely.
     Clock is repeated here for 7" where the navbar is very compact.
──────────────────────────────────────────────────────────────── -->
<div class="gate-bar">
  <span class="gate-msg" id="gate-msg">Waiting…</span>
  <div class="gate-bar-right">
    <div class="live-badge" style="border:none;background:none;padding:0;gap:6px;">
      <span class="status-dot" id="gate-status-dot"></span>
      <span id="gate-system-status" style="font-size:10px;color:var(--t3);font-family:var(--mono);">System OK</span>
    </div>
  </div>
</div>

<!-- ── Camera (full width) ─────────────────────────────────────── -->
<div class="body">
  <div class="cam-wrap">
    <img id="feed" src="/video_feed_kiosk" alt="Camera loading…">
    <div class="bracket tl"></div><div class="bracket tr"></div>
    <div class="bracket bl"></div><div class="bracket br"></div>
    <div class="cam-rec"><span class="rec-dot"></span><span>REC</span></div>
    <div class="cam-legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>Access Granted</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>Access Denied</div>
    </div>
  </div>
</div>

<!-- ── Detection popup ─────────────────────────────────────────────
     THE main feedback element. Appears on every face decision.
     Member sees their name + Granted (green) or Denied (red).
──────────────────────────────────────────────────────────────── -->
<div id="detect-popup">
  <div class="popup-type" id="popup-type">Access</div>
  <div class="popup-name" id="popup-name">—</div>
  <div class="popup-meta" id="popup-time">—</div>
</div>

<!-- ── Bottom bar ──────────────────────────────────────────────────
     Hidden on 7" (≤600px). Shown on larger screens for branding.
──────────────────────────────────────────────────────────────── -->
<div class="bottom-bar">
  <span><span class="status-dot"></span> CodeGloFix access control system is active</span>
  <span style="margin-left:auto">CodeGloFix &copy; <span id="foot-year"></span> CodeGloFix</span>
</div>

<div id="toast"></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/index.js"></script>
<script>
// ── PWA service worker registration ──────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('[PWA] SW registered:', reg.scope))
      .catch(err => console.log('[PWA] SW skipped:', err));
  });
}
</script>
</body>
</html>
